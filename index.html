<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR ถนน สุนัข และรถยนต์</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true"
  arjs="sourceType: webcam; debugUIEnabled: false;">

  <!-- แสง -->
  <a-light type="ambient" intensity="1.8"></a-light>
  <a-light
    type="directional"
    position="-3 6 4"
    intensity="2">
  </a-light>

  <!-- HIRO MARKER -->
  <a-marker
    preset="hiro"
    emitevents="true"
    id="hiroMarker">

    <!-- ========================= -->
    <!--          ถนน              -->
    <!-- ========================= -->

    <!-- พื้นถนน -->
    <a-box
      position="0 0 0"
      width="5"
      height="0.08"
      depth="3"
      color="#444444">
    </a-box>

    <!-- เส้นแบ่งถนน -->
    <a-box
      position="-1.5 0.055 0"
      width="0.65"
      height="0.02"
      depth="0.08"
      color="#FFFFFF">
    </a-box>

    <a-box
      position="0 0.055 0"
      width="0.65"
      height="0.02"
      depth="0.08"
      color="#FFFFFF">
    </a-box>

    <a-box
      position="1.5 0.055 0"
      width="0.65"
      height="0.02"
      depth="0.08"
      color="#FFFFFF">
    </a-box>

    <!-- ขอบถนน -->
    <a-box
      position="0 0.08 -1.3"
      width="5"
      height="0.12"
      depth="0.3"
      color="#777777">
    </a-box>

    <!-- ========================= -->
    <!--       สุนัขสีขาว           -->
    <!-- ========================= -->

    <a-entity
      id="dog"
      position="-0.7 0.25 0.35"
      scale="0.45 0.45 0.45">

      <!-- ลำตัว -->
      <a-sphere
        position="0 0.75 0"
        scale="1.45 0.75 0.7"
        color="#FFFFFF">
      </a-sphere>

      <!-- คอ -->
      <a-cylinder
        position="0.72 0.9 0"
        radius="0.28"
        height="0.5"
        color="#FFFFFF">
      </a-cylinder>

      <!-- หัว -->
      <a-sphere
        position="1.0 1.15 0"
        radius="0.48"
        color="#FFFFFF">
      </a-sphere>

      <!-- หูซ้าย -->
      <a-cone
        position="0.78 1.52 -0.28"
        radius-bottom="0.18"
        radius-top="0.04"
        height="0.5"
        color="#DDDDDD">
      </a-cone>

      <!-- หูขวา -->
      <a-cone
        position="0.78 1.52 0.28"
        radius-bottom="0.18"
        radius-top="0.04"
        height="0.5"
        color="#DDDDDD">
      </a-cone>

      <!-- จมูก -->
      <a-sphere
        position="1.43 1.08 0"
        radius="0.12"
        color="#222222">
      </a-sphere>

      <!-- ตา -->
      <a-sphere
        position="1.18 1.3 -0.35"
        radius="0.07"
        color="#111111">
      </a-sphere>

      <a-sphere
        position="1.18 1.3 0.35"
        radius="0.07"
        color="#111111">
      </a-sphere>

      <!-- ขาหน้า -->
      <a-cylinder
        id="frontLeg1"
        position="0.55 0.35 -0.32"
        radius="0.11"
        height="0.65"
        color="#FFFFFF">
      </a-cylinder>

      <a-cylinder
        id="frontLeg2"
        position="0.55 0.35 0.32"
        radius="0.11"
        height="0.65"
        color="#FFFFFF">
      </a-cylinder>

      <!-- ขาหลัง -->
      <a-cylinder
        id="backLeg1"
        position="-0.55 0.35 -0.32"
        radius="0.11"
        height="0.65"
        color="#FFFFFF">
      </a-cylinder>

      <a-cylinder
        id="backLeg2"
        position="-0.55 0.35 0.32"
        radius="0.11"
        height="0.65"
        color="#FFFFFF">
      </a-cylinder>

      <!-- หาง -->
      <a-cylinder
        position="-1.05 0.9 0"
        rotation="0 0 -45"
        radius="0.08"
        height="0.7"
        color="#FFFFFF">
      </a-cylinder>

    </a-entity>

    <!-- ========================= -->
    <!--       รถยนต์สีแดง          -->
    <!-- ========================= -->

    <a-entity
      id="car"
      position="-2.8 0.35 -0.45"
      rotation="0 0 0"
      scale="0.5 0.5 0.5">

      <!-- ตัวรถ -->
      <a-box
        position="0 0.45 0"
        width="1.7"
        height="0.45"
        depth="0.85"
        color="#E60000">
      </a-box>

      <!-- หลังคารถ -->
      <a-box
        position="0 0.78 0"
        width="0.85"
        height="0.35"
        depth="0.7"
        color="#CC0000">
      </a-box>

      <!-- กระจก -->
      <a-box
        position="0.01 0.79 -0.36"
        width="0.55"
        height="0.23"
        depth="0.02"
        color="#88CCFF">
      </a-box>

      <a-box
        position="0.01 0.79 0.36"
        width="0.55"
        height="0.23"
        depth="0.02"
        color="#88CCFF">
      </a-box>

      <!-- ล้อ -->
      <a-cylinder
        position="-0.55 0.18 -0.45"
        radius="0.2"
        height="0.12"
        rotation="90 0 0"
        color="#111111">
      </a-cylinder>

      <a-cylinder
        position="0.55 0.18 -0.45"
        radius="0.2"
        height="0.12"
        rotation="90 0 0"
        color="#111111">
      </a-cylinder>

      <a-cylinder
        position="-0.55 0.18 0.45"
        radius="0.2"
        height="0.12"
        rotation="90 0 0"
        color="#111111">
      </a-cylinder>

      <a-cylinder
        position="0.55 0.18 0.45"
        radius="0.2"
        height="0.12"
        rotation="90 0 0"
        color="#111111">
      </a-cylinder>

      <!-- ไฟหน้า -->
      <a-box
        position="0.86 0.5 -0.28"
        width="0.05"
        height="0.15"
        depth="0.2"
        color="#FFFFAA">
      </a-box>

      <a-box
        position="0.86 0.5 0.28"
        width="0.05"
        height="0.15"
        depth="0.2"
        color="#FFFFAA">
      </a-box>

    </a-entity>

  </a-marker>

  <!-- กล้อง -->
  <a-entity camera></a-entity>

</a-scene>

<script>
  const car = document.querySelector('#car');
  const dog = document.querySelector('#dog');

  let carDirection = 1;
  let carX = -2.8;
  let dogX = -0.7;

  let lastTime = performance.now();

  function animateScene(time) {
    const delta = (time - lastTime) / 1000;
    lastTime = time;

    if (car && car.object3D.visible) {
      carX += carDirection * delta * 1.5;

      if (carX > 3.2) {
        carX = 3.2;
        carDirection = -1;
        car.object3D.rotation.y = Math.PI;
      }

      if (carX < -3.2) {
        carX = -3.2;
        carDirection = 1;
        car.object3D.rotation.y = 0;
      }

      car.object3D.position.x = carX;
    }

    if (dog && dog.object3D.visible) {
      dogX += delta * 0.35;

      if (dogX > 1.2) {
        dogX = -1.2;
      }

      dog.object3D.position.x = dogX;

      /*
       * ทำให้สุนัขขยับตัวเล็กน้อย
       * เพื่อให้ดูเหมือนกำลังเดิน
       */
      const walk = Math.sin(time * 0.01) * 0.08;

      dog.object3D.rotation.z = walk;

      const legs = [
        '#frontLeg1',
        '#frontLeg2',
        '#backLeg1',
        '#backLeg2'
      ];

      legs.forEach((id, index) => {
        const leg = document.querySelector(id);
        if (leg) {
          leg.object3D.rotation.z =
            Math.sin(time * 0.012 + index * Math.PI) * 0.25;
        }
      });
    }

    requestAnimationFrame(animateScene);
  }

  requestAnimationFrame(animateScene);
</script>

</body>
</html>
